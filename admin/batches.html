  <div id="navbarRoot"></div>

  <div class="layout-with-sidebar">

    </nav>

    <main class="container admin-main">
      <div class="page-head">
        <h1>ব্যাচ</h1>
        <p>ব্যাচের তালিকা ও নতুন ব্যাচ তৈরি — ব্যাচে শিক্ষক বসানোই শিক্ষকের পেজে আসল ডেটা দেখায়।</p>
      </div>
      <span class="demo-badge" id="demoBadge" hidden>ডেমো তথ্য — এগুলো নমুনা ডেটা, আসল নয়</span>
      <div class="notice notice-err" id="errorBox" hidden></div>
      <div class="notice notice-ok" id="successBox" hidden></div>
      <div class="panel"><div id="batchList"><p class="muted">লোড হচ্ছে...</p></div></div>
      <div class="panel">
        <h2>নতুন ব্যাচ</h2>
        <form id="batchForm" novalidate>
          <div class="grid-2">
            <label class="field"><span>ব্যাচের নাম *</span><input type="text" id="batchName" placeholder="যেমন: HSC Physics Batch" required></label>
            <label class="field"><span>বিষয়</span><input type="text" id="batchSubject" placeholder="যেমন: পদার্থবিজ্ঞান"></label>
            <label class="field"><span>কোর্স</span><select id="batchCourse"><option value="">নির্বাচন করুন</option></select></label>
            <label class="field"><span>শিক্ষক *</span><select id="batchTeacher" required><option value="">নির্বাচন করুন</option></select></label>
            <label class="field"><span>শুরুর তারিখ</span><input type="date" id="batchStart"></label>
          </div>
          <button type="submit" class="btn btn-primary btn-block">ব্যাচ তৈরি করুন</button>
        </form>
      </div>

    </main>
  </div>
